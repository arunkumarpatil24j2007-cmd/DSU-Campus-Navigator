name: Build Android APK
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk DSU-Campus-Navigator.apk
      - uses: actions/upload-artifact@v4
        with: { name: DSU-Campus-Navigator-apk, path: DSU-Campus-Navigator.apk }
      - name: Publish rolling "latest" release
        if: github.ref == 'refs/heads/main'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest DSU-Campus-Navigator.apk --title "DSU Campus Navigator (latest APK)" --notes "Install on Android: download the APK, open it, allow installs from this source." --target "$GITHUB_SHA"
